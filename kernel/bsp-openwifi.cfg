# Kernel config fragment appended for the openwifi build mode
# (added on top of kernel/bsp.cfg by build_petalinux.sh when ENABLE_OPENWIFI=1)
CONFIG_WIRELESS=y
CONFIG_CFG80211=y
CONFIG_CFG80211_WEXT=y
CONFIG_NL80211_TESTMODE=y
CONFIG_CFG80211_DEBUGFS=y
CONFIG_MAC80211=y
CONFIG_MAC80211_LEDS=y
CONFIG_MAC80211_DEBUGFS=y
CONFIG_RFKILL=y
# openwifi data path uses Xilinx AXI DMA (scatter-gather);
# covered by CONFIG_XILINX_DMA=y already set in bsp.cfg
CONFIG_DMA_ENGINE=y
