CONFIG_IIO=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_KFIFO_BUF=y
CONFIG_IIO_BUFFER_DMAENGINE=y
CONFIG_AXI_DMAC=y
CONFIG_JESD204=y
CONFIG_ADI_AXI_DATA_OFFLOAD=y
CONFIG_CF_AXI_ADC=y
CONFIG_AD9361=y
CONFIG_CF_AXI_DDS=y
CONFIG_SPI_GPIO=y
CONFIG_SPI_CADENCE=y
CONFIG_GPIOLIB=y
# XXV 10G 网口：ADI 内核由 axienet 驱动支持 xlnx,xxv-ethernet-1.0，
# 数据通路走 AXI DMA (axistream-connected)
CONFIG_XILINX_AXI_EMAC=y
CONFIG_XILINX_DMA=y
# 修复启动卡死：ADI 内核未开 CPU_IDLE 时 EDAC_CORTEX_ARM64 默认 y，
# 其 edac-poller（cortex_arm64_edac_check）在本 SoC 上自旋导致 RCU stall
CONFIG_CPU_IDLE=y
# CONFIG_EDAC_CORTEX_ARM64 is not set
# 诊断：打印每次 driver probe 尝试，定位 deferred probe 自旋的驱动
CONFIG_DYNAMIC_DEBUG=y
CONFIG_SPI_SPIDEV=y
# MIPI CSI-2 摄像头 (OV5647) V4L2 标准框架：
# VIDEO_XILINX 自动 select MEDIA_CONTROLLER/V4L2_SUBDEV_API/VIDEOBUF2_DMA_CONTIG/XILINX_FRMBUF
CONFIG_MEDIA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_XILINX=y
CONFIG_VIDEO_XILINX_CSI2RXSS=y
CONFIG_VIDEO_XILINX_DEMOSAIC=y
CONFIG_VIDEO_OV5647=y
CONFIG_I2C_XILINX=y
